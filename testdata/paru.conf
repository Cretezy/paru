AurSecurityModel = gpt-test

[bin]
#Makepkg = bash
#MFlags = -x makepkg
Pager = cat
Sudo = fakeroot
Git = true

[env]
CARCH = x86_64

[pkgbuild]
Path = testdata/pkgbuild-repo
